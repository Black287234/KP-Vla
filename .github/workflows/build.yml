# Сборка и тесты при каждой отправке изменений
name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Stationery.sln -c Release
      - run: dotnet test Stationery.sln -c Release --no-build
